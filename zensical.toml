[project]
site_name = "RAMTable"
site_url = "https://thiagostilo2121.github.io/ramtable_py/"
site_description = """Typed in-memory tables for Python with runtime
schema and value validation, and no dependencies."""
site_author = "Thiago Stilo"
copyright = """Copyright &copy; 2026 Thiago Stilo &middot;
Released under the MIT license."""
repo_url = "https://github.com/thiagostilo2121/ramtable_py"
repo_name = "thiagostilo2121/ramtable_py"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Installation" = "guide/installation.md" },
  { "Guide" = [
    { "Overview" = "guide/index.md" },
    { "Create a table" = "guide/create-table.md" },
    { "Insert and read rows" = "guide/rows.md" },
    { "Filter rows" = "guide/filtering.md" },
    { "Update and delete rows" = "guide/updating-deleting.md" },
    { "Change the schema" = "guide/schema.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "API" = [
      { "Table" = "reference/api/table.md" },
      { "Columns" = "reference/api/columns.md" },
      { "Rows" = "reference/api/rows.md" },
      { "TypeValidator" = "reference/api/types.md" },
    ] },
    { "Types and validation" = "reference/types-and-validation.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "Project" = [
    { "Development" = "project/development.md" },
    { "Releases" = "project/releases.md" },
    { "Deprecation policy" = "project/deprecation.md" },
    { "1.0 guarantees" = "project/guarantees.md" },
    { "Changelog" = "project/changelog.md" },
    { "Contributing" = "project/contributing.md" },
    { "License" = "project/license.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
custom_dir = "overrides"
font = false
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
  "navigation.path",
  "navigation.tracking",
  "navigation.footer",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
restrict_base_path = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/thiagostilo2121/ramtable_py"
name = "RAMTable on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ramtable/"
name = "RAMTable on PyPI"

[project.plugins.markdown-exec]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false
options.show_root_heading = false
options.filters = ["!^_(?!_)"]
