[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramtable"
version = "1.0.0"
description = "A lightweight in-memory table library for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Thiago Valentín Stilo Limarino" }
]
keywords = [
    "table",
    "in-memory",
    "data-structure",
    "python"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py311"
line-length = 79
extend-exclude = ["site", "dist"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "UP",
    "B",
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately exercise deprecated typing aliases.
"tests/test_type_validator.py" = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ramtable"]

[tool.coverage.report]
show_missing = true
fail_under = 98

[tool.hatch.build.targets.wheel]
packages = ["src/ramtable"]
